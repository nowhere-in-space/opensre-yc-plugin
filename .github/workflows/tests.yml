name: tests

on:
  push:
    branches: [main]
  pull_request:

# A run in progress is worth nothing once newer commits exist on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest against OpenSRE main
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v7
        with:
          path: opensre-yc-plugin

      # The suite drives the plugin through OpenSRE's own tool registry and
      # alert routing, so it needs a checkout rather than a published package.
      # Tracking main is deliberate: the plugin's whole claim is that it works
      # against upstream without changing it, and this is what checks that.
      - name: Check out OpenSRE
        uses: actions/checkout@v7
        with:
          repository: Tracer-Cloud/opensre
          path: opensre

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the OpenSRE environment
        working-directory: opensre
        run: uv sync

      - name: Install the plugin into it
        working-directory: opensre
        run: uv pip install -e "../opensre-yc-plugin[dev]"

      - name: Run the tests
        working-directory: opensre-yc-plugin
        env:
          OPENSRE_ROOT: ${{ github.workspace }}/opensre
        run: ../opensre/.venv/bin/python -m pytest -q
